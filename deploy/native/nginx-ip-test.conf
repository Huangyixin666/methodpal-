limit_req_zone $binary_remote_addr zone=methodpal_auth:10m rate=5r/m;

server {
    listen 80;
    server_name 139.199.4.56;
    return 301 https://139.199.4.56$request_uri;
}

server {
    listen 443 ssl;
    server_name 139.199.4.56;
    ssl_certificate /etc/methodpal/tls/server.crt;
    ssl_certificate_key /etc/methodpal/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/methodpal/current/dist;
    client_max_body_size 20m;
    client_body_timeout 20s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=methodpal_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
